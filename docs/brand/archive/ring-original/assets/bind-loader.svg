<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -12 80 80" role="img" aria-label="Loading"><title>Loading</title><style>
.clasp{transform:translateY(-5px)}
@media (prefers-reduced-motion:no-preference){.clasp{animation:lift 1400ms infinite}}
@keyframes lift{
0%{transform:translateY(-9px);animation-timing-function:cubic-bezier(.45,0,.2,1)}
28%,52%{transform:translateY(0);animation-timing-function:cubic-bezier(.45,0,.2,1)}
80%,100%{transform:translateY(-9px)}}</style><path class="ring" d="M41.39 14.34 A20 20 0 1 1 22.61 14.34" fill="none" stroke="#1A1612" stroke-width="6" stroke-linecap="round" pathLength="100"/><path class="clasp" d="M23.87 13.73 A20 20 0 0 1 40.13 13.73" fill="none" stroke="#A94F25" stroke-width="6" stroke-linecap="round"/></svg>
