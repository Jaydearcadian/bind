services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bind_local
      POSTGRES_USER: bind_local
      POSTGRES_PASSWORD: bind_local_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bind_local -d bind_local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - bind_local_pgdata:/var/lib/postgresql/data

volumes:
  bind_local_pgdata:
